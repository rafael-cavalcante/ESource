{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous" />
</head>

<body>
    {% include 'fragments/navbar.html'%}

    <div class="container-fluid min-vh-100 d-flex flex-column justify-content-center align-items-center"
        style="padding-top: 70px;">

        <!-- ALERTA -->
        {% if messages %}
        <div class="w-100 d-flex justify-content-center">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert"
                style="max-width: 400px; width: 100%;">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- CARD LOGIN -->
        <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
            <div class="card-header d-flex align-items-center justify-content-center gap-2">
                <img src="/static/img/logo.png" alt="logo ESource" width="48" height="48">
                <h2 class="mb-0">Login</h2>
            </div>
            <div class="card-body">
                <form method="post" class="needs-validation" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="username" name="username"
                            placeholder="Digite seu usuário" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Digite sua senha" required>
                    </div>
                    <div class="d-grid">
                        <button class="btn btn-outline-primary" type="submit">Entrar</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-body-secondary text-center">
                © 2025
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script src="{% static 'js/validacao.js' %}"></script>
</body>

</html>
