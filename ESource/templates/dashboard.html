    <style>
        /* Garante que o HTML e body não causem overflow extra */
        html,
        body {
            margin: 0;
            padding: 0;
            overflow-x: auto;
            overflow-y: hidden;
            height: 100%;
            width: 100%;
        }

        /* Força o iframe a ocupar 100% da altura da viewport */
        .django-plotly-dash-app iframe {
            position: relative !important;
            width: 100% !important;
            height: 100vh !important;
            border: none;
        }

        /* Ajuste da div externa do Dash */
        .django-plotly-dash-app>div {
            padding-bottom: 0 !important;
            height: 100vh !important;
            overflow: hidden !important;
        }
    </style>
</head>

<body>
    {% include 'fragments/navbar.html'%}

    <div class="django-plotly-dash-app mt-5 pt-4">
        {% plotly_app name="Dashboard" %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
