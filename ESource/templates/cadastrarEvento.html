<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    {% include 'fragments/navbar.html'%}

    <div class="container mt-5 pt-4 mb-5 pb-4">
        <div class="form-container">
            <h2 class="mb-4">Cadastro de Evento</h2>
            <form method="post" action="">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome do Evento</label>
                    <input type="text" class="form-control" id="nome" name="nome" value="{{ evento.nome|default:'' }}"
                        required>
                </div>

                <div class="mb-3">
                    <label for="sigla" class="form-label">Sigla</label>
                    <input type="text" class="form-control" id="sigla" name="sigla" placeholder="Ex: SECOMP, ENECTI"
                        value="{{ evento.sigla|default:'' }}" required>
                </div>

                <div class="mb-3">
                    <label for="data" class="form-label">Ano</label>
                    <input type="date" class="form-control" id="data" name="data" value="{{ evento.data|date:'Y-m-d' }}"
                        required>
                </div>

                <div class="mb-3">
                    <label for="link" class="form-label">Link do Evento</label>
                    <input type="url" class="form-control" id="link" name="link" placeholder="https://exemplo.com"
                        value="{{ evento.link|default:'' }}" required>
                </div>

                <button type="submit" class="btn btn-outline-primary">Cadastrar Evento</button>
            </form>

        </div>
    </div>

    {% include 'fragments/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
