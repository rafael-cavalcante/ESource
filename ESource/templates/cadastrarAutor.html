{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Evento</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    {% include 'fragments/navbar.html'%}

    <div class="container mt-5 pt-4 mb-5 pb-4">
        <div class="col-lg-8 col-md-10 col-sm-12 mx-auto">
            <div class="card">
                <h5 class="card-header">Cadastro de Autor</h5>
                <div class="card-body">
                    <form method="post" class="needs-validation" novalidate>
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome do Autor</label>
                            <input type="text" class="form-control" id="nome" name="nome"
                                value="{{ autor.nome|default:'' }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="citacao" class="form-label">Citação</label>
                            <input type="text" class="form-control" id="citacao" name="citacao"
                                placeholder="Ex: Santos, R. C." value="{{ autor.citacao|default:'' }}" required>
                        </div>

                        <button type="submit" class="btn btn-outline-primary">Cadastrar Autor</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    {% include 'fragments/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/validacao.js' %}"></script>
</body>

</html>
