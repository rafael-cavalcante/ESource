<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Artigo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    {% include 'fragments/navbar.html'%}

    <div class="container">
        <div class="form-container">
            <h2 class="mb-4">Cadastro de Artigo</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="titulo" class="form-label">Título do Artigo</label>
                    <input type="text" class="form-control" id="titulo" name="titulo"
                        value="{{ artigo.titulo|default:'' }}" required>
                </div>

                <div class="mb-3">
                    <label for="autor" class="form-label">Autor</label>
                    <input type="text" class="form-control" id="autor" name="autor"
                        value="{{ artigo.autor|default:'' }}" required>
                </div>

                <div class="mb-3">
                    <label for="subarea" class="form-label">Subárea</label>
                    <input type="text" class="form-control" id="subarea" name="subAreas" placeholder="Ex: IA, Web"
                        value="{{ artigo.subAreas|default:'' }}">
                </div>

                <div class="mb-3">
                    <label for="evento" class="form-label">Evento</label>
                    <select class="form-select" id="evento" name="evento">
                        <option value="">Selecione um evento</option>
                        {% for ev in eventos %}
                        <option value="{{ ev.id }}" {% if ev.id == artigo.evento.id %} selected {% endif %}>
                            {{ ev.nome }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="data" class="form-label">Data de Publicação</label>
                    <input type="date" class="form-control" id="data" name="dataPublicacao"
                        value="{{ artigo.dataPublicacao|date:'Y-m-d'|default:'' }}" required>
                </div>

                <div class=" mb-3">
                    <label for="link" class="form-label">Link de Referência</label>
                    <input type="url" class="form-control" id="link" name="link" value="{{ artigo.link|default:'' }}"
                        placeholder="https://exemplo.com/artigo">
                </div>

                <div class="mb-3">
                    <label for="imagem" class="form-label">Imagem Destacada</label>
                    <input type="file" class="form-control" id="imagem" name="imagem" accept="image/*">
                </div>

                <div class="mb-3">
                    <label for="summernote" class="form-label">Conteúdo do Artigo</label>
                    <textarea id="summernote" name="conteudo" class="form-control" rows="6">{{ artigo.conteudo|default:'' }}</textarea>
                </div>

                <button type="submit" class="btn btn-outline-primary">Cadastrar Artigo</button>
            </form>

        </div>
    </div>

    <!-- include libraries(jQuery, bootstrap) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function () {
            $("#summernote").summernote({ height: 300 });
            $('.dropdown-toggle').dropdown();
        });
    </script>

</body>

</html>
