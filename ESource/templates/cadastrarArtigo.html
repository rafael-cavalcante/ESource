<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Artigo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index-admin.html">ESource</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="chatIA.html">Chat IA</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">
                        Artigo
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="cadastrarArtigo.html">Cadastrar</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">
                        Evento
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="cadastrarEvento.html">Cadastrar</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-container">
        <h2 class="mb-4">Cadastro de Artigo</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="titulo" class="form-label">Título do Artigo</label>
                <input type="text" class="form-control" id="titulo" name="titulo" required>
            </div>

            <div class="mb-3">
                <label for="autor" class="form-label">Autor</label>
                <input type="text" class="form-control" id="autor" name="autor" required>
            </div>

            <div class="mb-3">
                <label for="subarea" class="form-label">Subárea</label>
                <input type="text" class="form-control" id="subarea" name="subAreas" placeholder="Ex: IA, Web">
            </div>

            <div class="mb-3">
                <label for="evento" class="form-label">Evento</label>
                <select class="form-select" id="evento" name="evento">
                    <option value="">Selecione um evento</option>
                    {% for ev in eventos %}
                    <option value="{{ ev.id }}">{{ ev.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="data" class="form-label">Data de Publicação</label>
                <input type="date" class="form-control" id="data" name="dataPublicacao" required>
            </div>

            <div class="mb-3">
                <label for="link" class="form-label">Link de Referência</label>
                <input type="url" class="form-control" id="link" name="link" placeholder="https://exemplo.com/artigo">
            </div>

            <div class="mb-3">
                <label for="imagem" class="form-label">Imagem Destacada</label>
                <input type="file" class="form-control" id="imagem" name="imagem" accept="image/*">
            </div>

            <div class="mb-3">
                <label for="summernote" class="form-label">Conteúdo do Artigo</label>
                <textarea id="summernote" name="conteudo" class="form-control" rows="6"></textarea>
            </div>

            <button type="submit" class="btn btn-outline-primary">Cadastrar Artigo</button>
        </form>

    </div>
</div>

<!-- include libraries(jQuery, bootstrap) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    $(document).ready(function() {
        $("#summernote").summernote({height: 300});
        $('.dropdown-toggle').dropdown();
    });
</script>

</body>

</html>
