<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Visualizar Artigo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            margin-top: 50px;
        }

        .card-header {
            background-color: #0d6efd;
            color: white;
        }

        .label-bold {
            font-weight: 600;
        }
    </style>
</head>

<body>
    {% include 'fragments/navbar.html'%}

    <div class="container mb-4">
        <div class="card">
            <img src="{{ artigo.imagem|default:'/static/img/banner.jpg' }}" class="card-img-top" alt="...">
            <div class="card-header">
                <h4 class="mb-0">{{ artigo.titulo }}</h4>
            </div>
            <div class="card-body">
                <p><span class="label-bold">Autores:</span> {{ artigo.autor }}</p>

                <p><span class="label-bold">Data:</span> {{ artigo.dataPublicacao }}</p>

                <p><span class="label-bold">Subárea:</span> {{ artigo.subAreas }}</p>

                <p><span class="label-bold">Evento:</span> {{ artigo.evento }}</p>

                <p><span class="label-bold">Link:</span>
                    <a href="{{ artigo.link }}" target="_blank">
                        {{ artigo.link }}
                    </a>
                </p>

                <hr>

                <div class="mb-3">
                    <label class="form-label">Conteúdo do Artigo</label>
                    <div class="form-control" style="min-height: 300px;">
                        {{ artigo.conteudo|safe }}
                    </div>
                </div>
            </div>
            <div class="card-footer text-end">
                <a href="javascript:history.back()" class="btn btn-secondary">Voltar</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
