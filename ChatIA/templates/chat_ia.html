{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Assistente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/chatia.css' %}" />
</head>

<body class="bg-light">

    {% include 'fragments/navbar.html'%}

    <div class="container mt-5 pt-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h5>Assistente Virtual</h5>
            </div>
            <div class="card-body" id="chat-box">
                <div class="text-muted text-center">Bem-vindo! Pergunte algo.</div>
            </div>
            <div class="card-footer">
                <div class="input-group">
                    <input type="text" id="user-input" class="form-control" placeholder="Digite sua mensagem..." />
                    <button class="btn btn-primary" id="send-btn">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Carregando o JavaScript da pasta static/js -->
    <script src="{% static 'js/chatia.js' %}"></script>
</body>

</html>
